[package]
name = "froglang-core"
version = "0.1.0"
edition = "2021"
default-run = "froglang-core"
# `benches/` also holds the hand-written Rust/Go/Lua/Python reimplementations
# that `run_comparisons.sh` builds for cross-language timing. Those are
# standalone programs, not cargo bench targets, so declare the real ones
# explicitly rather than letting cargo pick up every file in the directory.
autobenches = false

[features]
# Enable verbose GC tracing to stderr (allocations, collections, marks, frees).
# Usage: cargo test --features gc_trace
gc_trace = []
# Swap `json.parse`'s DOM backend from `serde_json` to `simd-json`
# (`runtime/json/dom.rs`). Same observable behaviour — `tests/test_json.rs`
# is expected to pass identically under both — but SIMD-accelerated parsing
# on x86_64 (SSE4.2/AVX2) and aarch64 (NEON).
# Usage: cargo test --features json_simd
json_simd = ["dep:simd-json"]

[dependencies]
froglang-macros = { path = "../froglang-macros" }
rustyline = "17.0.1"
cranelift-codegen  = "0.135"
cranelift-frontend = "0.135"
cranelift-module   = "0.135"
cranelift-jit      = "0.135"
cranelift-object   = "0.135"
cranelift-native   = "0.135"
# `json.to_str` / `json.parse`'s DOM (`plans/DATA.md` stage 8). Already in
# the workspace lockfile via `playground-server`, so this costs no new
# build. `simd-json` is the opt-in fast path — see the `json_simd` feature.
serde_json = "1"
simd-json = { version = "0.14", optional = true }
hashbrown = "0.17.1"

# `staticlib` produces `libfroglang_core.a` — the runtime (`frog_*` `#[no_mangle]`
# symbols in `runtime/`) linked into an AOT-compiled froglang executable
# (`plans/AOT.md`, G7). `rlib` is what the `froglang-core` bin links against.
[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "froglang-core"
path = "src/main.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false

