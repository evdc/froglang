[package]
name = "froglang-core"
version = "0.1.0"
edition = "2021"
default-run = "froglang-core"

[features]
# Enable verbose GC tracing to stderr (allocations, collections, marks, frees).
# Usage: cargo test --features gc_trace
gc_trace = []

[dependencies]
froglang-macros = { path = "../froglang-macros" }
rustyline = "17.0.1"
cranelift-codegen  = "0.113"
cranelift-frontend = "0.113"
cranelift-module   = "0.113"
cranelift-jit      = "0.113"
cranelift-native   = "0.113"

[[bin]]
name = "froglang-core"
path = "src/main.rs"

